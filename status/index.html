<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Teleseerr · Status</title><style>body{font:17px/1.6 system-ui;max-width:620px;margin:12vh auto;padding:24px;background:#111213;color:#f6f3ed}h1{font-size:40px;letter-spacing:-1.5px}article{padding:20px 0;border-bottom:1px solid #ffffff24}small,p{color:#adadad}a{color:#f2bd63}.up{color:#8fdbb0}.down{color:#f0bc71}</style><p>TELESEERR</p><h1>Is movie night on?</h1><div id="status" role="status">Checking the latest independent observation…</div><p id="time"></p><p>This page runs on GitHub Pages, independently of the home server. Checks are scheduled every 15 minutes and can be delayed. Reachability does not test playback on your device.</p><p><a href="https://teleseerr.cn.lt">Open Teleseerr ↗</a></p><script>fetch('./status.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const age=Date.now()-Date.parse(d.checkedAt);const stale=!Number.isFinite(age)||age>45*60000;document.getElementById('status').replaceChildren(...d.services.map(s=>{const a=document.createElement('article');a.className=stale?'':s.available?'up':'down';a.textContent=(stale?'?':s.available?'✓':'⚠')+' '+s.name+' · '+(stale?'Status unknown — last check is old':s.available?'Reachable':'Unavailable');return a}));document.getElementById('time').textContent='Last checked: '+new Date(d.checkedAt).toLocaleString()}).catch(()=>{document.getElementById('status').textContent='Status is unavailable. This does not confirm an outage.'});</script></html>
