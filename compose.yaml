services:
  teleseerr:
    build: .
    container_name: teleseerr
    environment:
      - TELEGRAM_BOT_TOKEN=${TELESEERR_TELEGRAM_BOT_TOKEN}
      - SEERR_URL=http://seerr:5055
      - SEERR_API_KEY=${TELESEERR_SEERR_API_KEY}
      - TELESEERR_ADMIN_USER_ID=${TELESEERR_ADMIN_USER_ID}
      - TELESEERR_ADMIN_SEERR_USER_ID=${TELESEERR_ADMIN_SEERR_USER_ID:-1}
      - TELESEERR_MINI_APP_URL=${TELESEERR_MINI_APP_URL:-}
      - TELESEERR_WEBHOOK_SECRET=${TELESEERR_WEBHOOK_SECRET:-}
      - TELESEERR_ANIME_SONARR_ID=${TELESEERR_ANIME_SONARR_ID:-}
      - TELESEERR_RADARR_URL=${TELESEERR_RADARR_URL:-}
      - TELESEERR_RADARR_API_KEY=${TELESEERR_RADARR_API_KEY:-}
      - TELESEERR_RADARR_4K_URL=${TELESEERR_RADARR_4K_URL:-}
      - TELESEERR_RADARR_4K_API_KEY=${TELESEERR_RADARR_4K_API_KEY:-}
      - TELESEERR_SONARR_URL=${TELESEERR_SONARR_URL:-}
      - TELESEERR_SONARR_API_KEY=${TELESEERR_SONARR_API_KEY:-}
      - TELESEERR_SONARR_4K_URL=${TELESEERR_SONARR_4K_URL:-}
      - TELESEERR_SONARR_4K_API_KEY=${TELESEERR_SONARR_4K_API_KEY:-}
      - TELESEERR_AUTO_RETRY_FAILED=${TELESEERR_AUTO_RETRY_FAILED:-false}
      - TELESEERR_RETRY_DELAYS_SECONDS=${TELESEERR_RETRY_DELAYS_SECONDS:-30,120,300}
      - NODE_ENV=production
    volumes:
      - teleseerr-data:/app/data
    ports:
      - 3000:3000
    networks:
      - arr_network
    restart: unless-stopped

volumes:
  teleseerr-data:

networks:
  arr_network:
    external: true
    name: ${TELESEERR_DOCKER_NETWORK:-arr_default}
