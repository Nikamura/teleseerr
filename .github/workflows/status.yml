name: Independent status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['status/**', 'scripts/check-status.mjs', '.github/workflows/status.yml']
  workflow_run:
    workflows: [Docker]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: status-pages
  cancel-in-progress: false
jobs:
  status:
    if: vars.TELESEERR_PUBLIC_URL != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-status.mjs
        env:
          TELESEERR_PUBLIC_URL: ${{ vars.TELESEERR_PUBLIC_URL }}
          SEERR_PUBLIC_URL: ${{ vars.SEERR_PUBLIC_URL }}
          PLEX_PUBLIC_URL: ${{ vars.PLEX_PUBLIC_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: status
      - name: Publish observation
        id: deployment
        uses: actions/deploy-pages@v4
