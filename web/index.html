<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="analytics-path-mode" content="screens">
  <title>Teleseerr · Find your next favorite</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/facelift.css">
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="masthead"><a class="brand" href="/discover" aria-label="Teleseerr home"><span class="brand-mark"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m8 5 11 7-11 7Z" fill="currentColor"/></svg></span>teleseerr</a>
      <button class="profile-btn" id="profile-btn" title="Your account" aria-label="Your account"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></button></div>
    <nav class="tabs primary-nav" id="tabs-nav" aria-label="Main navigation">
      <a href="/discover" class="tab active" data-tab="trending"><span data-icon="compass"></span><span>Discover</span></a>
      <a href="/requests" class="tab" data-tab="requests"><span data-icon="tray"></span><span>Requests</span></a>
      <a href="/you" class="tab" data-tab="profile"><span data-icon="user"></span><span>You</span></a>
    </nav>
    </header>
    <section class="browse-header" aria-label="Browse and search">
      <div class="discovery-intro"><h1>Find your next favorite.</h1><p>Movies, series, and a little obsession.</p></div>
      <div class="search-bar"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input type="search" id="search-input" placeholder="Search movies, shows, people" aria-label="Search movies, shows and people" autocomplete="off"></div>
      <div class="browse-tabs" aria-label="Browse categories">
        <button class="tab browse-tab active" data-tab="trending">For you</button><button class="tab browse-tab" data-tab="movies">Movies</button><button class="tab browse-tab" data-tab="tv">TV shows</button><button class="tab browse-tab" data-tab="anime">Anime</button>
      </div>
    </section>


    <!-- Content area -->
    <main id="content">
      <div id="trending-view" class="view active"></div>
      <div id="movies-view" class="view"></div>
      <div id="tv-view" class="view"></div>
      <div id="anime-view" class="view"></div>
      <div id="search-view" class="view"></div>
      <div id="requests-view" class="view"></div>
      <div id="detail-view" class="view"></div>
      <div id="person-view" class="view"></div>
      <div id="profile-view" class="view"></div>
      <div id="admin-view" class="view"></div>
      <div id="unlinked-view" class="view"></div>
    </main>

    <!-- Loading overlay -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
